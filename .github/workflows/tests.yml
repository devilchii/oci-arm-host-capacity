name: OCI Auto Instance

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP or Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run script
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY: ${{ secrets.OCI_MEMORY }}
        run: |
          echo "Running OCI Auto Instance script..."
          # Jika repositori ini menggunakan script npm/node, jalankan:
          npm install && npm start || true
