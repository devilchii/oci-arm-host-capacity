name: OCI ARM Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > key.pem
          chmod 600 key.pem

      - name: Install dependencies
        run: composer install

      - name: Execute OCI Auto Instance Script
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_PRIVATE_KEY_FILENAME: key.pem
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY: ${{ secrets.OCI_MEMORY }}
          OCI_AVAILABILITY_DOMAIN: ""
          OCI_IMAGE_ID: ""
        run: php index.php
