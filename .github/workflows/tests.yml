name: OCI ARM Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > key.pem
          chmod 600 key.pem

      - name: Create .env File
        run: |
          echo "OCI_USER_ID=${{ secrets.OCI_USER_OCID }}" >> .env
          echo "OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_OCID }}" >> .env
          echo "OCI_REGION=${{ secrets.OCI_REGION }}" >> .env
          echo "OCI_KEY_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}" >> .env
          echo "OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_OCID }}" >> .env
          echo "OCI_PRIVATE_KEY_FILENAME=key.pem" >> .env
          echo "OCI_OCPUS=${{ secrets.OCI_OCPUS }}" >> .env
          echo "OCI_MEMORY=${{ secrets.OCI_MEMORY }}" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=" >> .env
          echo "OCI_IMAGE_ID=" >> .env

      - name: Install dependencies
        run: composer install

      - name: Execute OCI Auto Instance Script
        run: php index.php
